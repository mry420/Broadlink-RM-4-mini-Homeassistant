name: "Broadlink IR Manager"
version: "1.3.0"
slug: "broadlink_manager"
description: "Einfache Benutzeroberfläche zum Anlernen und Verwalten von Broadlink RM4 mini IR-Codes"
url: "https://github.com/mry420/Broadlink-RM-4-mini-Homeassistant"
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8000
panel_icon: "mdi:remote"
panel_title: "Broadlink IR"
# Creates one script per button and the "Fernbedienungen" dashboard via the HA API.
homeassistant_api: true
# Read/write access to the HA config folder, used only to place SmartIR
# code files in custom_components/smartir/codes/.
map:
  - type: homeassistant_config
    read_only: false
options:
  broadlink_ip: ""
  broadlink_mac: ""
schema:
  broadlink_ip: "str"
  broadlink_mac: "str"
